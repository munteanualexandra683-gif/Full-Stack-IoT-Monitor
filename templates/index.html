<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Arduino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="dashboard-wrapper">
        <header>
            <h1>Command Center</h1>
            <p class="subtitle">Live Sensor Telemetry</p>
        </header>

        <div class="container">
            <div class="card">
                <div class="card-header">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                    <h2>Voltage</h2>
                </div>
                <div class="value-container">
                    <div class="value" id="tensiune">-- V</div>
                    <div class="indicator" id="voltage-indicator"></div>
                </div>
            </div>

            
            <div class="card">
                <div class="card-header">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
                    </svg>
                    <h2>Temperature</h2>
                </div>
                <div class="value-container">
                    <div class="value" id="temperatura">-- °C</div>
                </div>
            </div>
        </div>

        <div class="card chart-card">
            <div class="card-header chart-header">
                <div class="header-title">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <h2>Telemetry History</h2>
                </div>
                <a href="/api/download" class="btn-download">
                    <svg class="icon-small" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download CSV
                </a>
            </div>
            <div class="chart-container">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <div class="timestamp-container">
            <div class="timestamp">
                Last updated: <span id="timestamp">--</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
